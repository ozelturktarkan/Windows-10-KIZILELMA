name: Internet Archive ISO dogrulamasi

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/verify-archive-iso.yml

permissions:
  contents: read

concurrency:
  group: archive-iso-verification
  cancel-in-progress: false

jobs:
  metadata:
    name: Archive metadata ve yayin hashleri
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      iso_url: ${{ steps.check.outputs.iso_url }}
    steps:
      - name: Dosya boyutunu ve Archive hashlerini karsilastir
        id: check
        shell: bash
        run: |
          python3 -u - <<'PY'
          import datetime, json, os, time, urllib.parse, urllib.request

          def fetch(url):
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent": "KIZILELMA-ISO-Verification/1.0", "Accept-Encoding": "identity"})
                      with urllib.request.urlopen(req, timeout=45) as response:
                          data = response.read(8 * 1024 * 1024 + 1)
                          if len(data) > 8 * 1024 * 1024:
                              raise ValueError("Metadata beklenenden buyuk")
                          return data
                  except Exception:
                      if attempt == 2:
                          raise
                      time.sleep(5 * (attempt + 1))

          root = "https://raw.githubusercontent.com/{}/{}".format(os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_SHA"])
          text = fetch(root + "/ISO-HASHES.txt").decode("utf-8-sig")
          lines = text.splitlines()
          expected = dict(line.split(": ", 1) for line in lines[1:] if ": " in line)
          expected_size = int(expected["Bytes"])
          metadata_url = "https://archive.org/metadata/windows-10-kizilelma"
          metadata = json.loads(fetch(metadata_url))
          candidates = [f for f in metadata.get("files", []) if f.get("name", "").lower().endswith(".iso")]
          print("ARCHIVE_ISO_CANDIDATES=" + json.dumps([{k: f.get(k) for k in ("name", "size", "md5", "sha1", "sha256", "source", "format")} for f in candidates], ensure_ascii=False))
          matches = [f for f in candidates if str(f.get("size")) == str(expected_size) and str(f.get("sha1", "")).lower() == expected["SHA1"].lower() and str(f.get("md5", "")).lower() == expected["MD5"].lower()]
          if len(matches) != 1:
              raise SystemExit("HATA: Depodaki boyut/SHA-1/MD5 ile eslesen tam bir ISO kaydi bulunamadi (eslesme: {}).".format(len(matches)))
          iso = matches[0]
          if iso.get("sha256") and iso["sha256"].lower() != expected["SHA256"].lower():
              raise SystemExit("HATA: Archive SHA-256 degeri depoyla eslesmiyor")
          url = "https://archive.org/download/windows-10-kizilelma/" + urllib.parse.quote(iso["name"], safe="")
          report = {
              "status": "metadata_match_only",
              "checked_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "source_commit": os.environ["GITHUB_SHA"],
              "archive_metadata_url": metadata_url,
              "archive_file": iso["name"],
              "download_url": url,
              "size_bytes": expected_size,
              "archive_sha1": iso["sha1"],
              "archive_md5": iso["md5"],
              "expected_sha256": expected["SHA256"],
              "full_file_verified": False,
          }
          print("METADATA_REPORT=" + json.dumps(report, ensure_ascii=False, sort_keys=True))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write("iso_url=" + url + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## Archive metadata eslesti\n\nBoyut, SHA-1 ve MD5 yayin kaydiyla ayni. Bu adim tek basina tam dosya SHA-256 dogrulamasi degildir.\n\n```json\n" + json.dumps(report, ensure_ascii=False, indent=2) + "\n```\n")
          PY

  full-file:
    name: Tam ISO SHA-256 SHA-1 MD5 dogrulamasi
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: ISO baytlarini akis halinde oku ve hashleri karsilastir
        shell: bash
        env:
          ISO_URL: ${{ needs.metadata.outputs.iso_url }}
        run: |
          python3 -u - <<'PY'
          import datetime, hashlib, json, os, time, urllib.request

          def request(url, headers=None):
              values = {"User-Agent": "KIZILELMA-ISO-Verification/1.0", "Accept-Encoding": "identity"}
              values.update(headers or {})
              return urllib.request.urlopen(urllib.request.Request(url, headers=values), timeout=60)

          root = "https://raw.githubusercontent.com/{}/{}".format(os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_SHA"])
          with request(root + "/ISO-HASHES.txt") as response:
              text = response.read(65536).decode("utf-8-sig")
          expected = dict(line.split(": ", 1) for line in text.splitlines()[1:] if ": " in line)
          size = int(expected["Bytes"])
          hashes = {name: hashlib.new(name) for name in ("sha256", "sha1", "md5")}
          count = 0
          threshold = 256 * 1024 * 1024
          next_progress = threshold
          url = os.environ["ISO_URL"]
          final_url = None
          started = datetime.datetime.now(datetime.timezone.utc).isoformat()
          error = None
          for attempt in range(1, 5):
              try:
                  headers = {"Range": "bytes={}-".format(count)} if count else {}
                  with request(url, headers) as response:
                      final_url = response.geturl()
                      if count:
                          content_range = response.headers.get("Content-Range", "")
                          if response.status != 206 or content_range != "bytes {}-{}/{}".format(count, size - 1, size):
                              raise ValueError("Sunucu dogru devam araligini dondurmedi: " + content_range)
                      elif response.status != 200:
                          raise ValueError("Beklenmeyen HTTP durumu: " + str(response.status))
                      length = response.headers.get("Content-Length")
                      if length is not None and int(length) != size - count:
                          raise ValueError("HTTP Content-Length yayin boyutuyla eslesmiyor")
                      while True:
                          block = response.read(1024 * 1024)
                          if not block:
                              break
                          if count + len(block) > size:
                              raise ValueError("Indirme yayin boyutunu asti")
                          for digest in hashes.values():
                              digest.update(block)
                          count += len(block)
                          if count >= next_progress:
                              print("PROGRESS {}/{} bytes ({:.1f}%)".format(count, size, count * 100 / size), flush=True)
                              next_progress += threshold
                  if count != size:
                      raise IOError("Eksik indirme: {}/{}".format(count, size))
                  error = None
                  break
              except Exception as exc:
                  error = "{}: {}".format(type(exc).__name__, exc)
                  print("ATTEMPT {} FAILED at {} bytes: {}".format(attempt, count, error), flush=True)
                  if count == size:
                      break
                  if attempt < 4:
                      time.sleep(5 * attempt)
          actual = {name: digest.hexdigest() for name, digest in hashes.items()}
          matches = {name: value.lower() == expected[name.upper()].lower() for name, value in actual.items()}
          passed = error is None and count == size and all(matches.values())
          report = {
              "status": "verified_full_download" if passed else "failed",
              "started_at_utc": started,
              "checked_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "source_commit": os.environ["GITHUB_SHA"],
              "run_url": "https://github.com/{}/actions/runs/{}".format(os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_RUN_ID"]),
              "download_url": url,
              "resolved_download_url": final_url,
              "size_bytes": count,
              "expected_size_bytes": size,
              "hashes": actual,
              "hash_matches": matches,
              "full_file_verified": passed,
              "error": error,
              "scope": "File integrity only; ISO was not mounted, executed, installed or malware-scanned.",
          }
          print("VERIFICATION_REPORT=" + json.dumps(report, ensure_ascii=False, sort_keys=True), flush=True)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("## Tam ISO dogrulamasi: " + ("BASARILI" if passed else "BASARISIZ") + "\n\n```json\n" + json.dumps(report, ensure_ascii=False, indent=2) + "\n```\n\nBu kontrol dosya butunlugunu olcer; guvenlik veya kurulum sertifikasi degildir. ISO kalici olarak saklanmaz ve calistirilmaz.\n")
          if not passed:
              raise SystemExit(1)
          PY
